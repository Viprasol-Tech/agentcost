[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcost"
version = "0.1.0"
description = "Zero-infra LLM cost attribution: track spend per feature, per agent-run, per user, no gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = [
    "llm",
    "cost-tracking",
    "cost-attribution",
    "observability",
    "openai",
    "anthropic",
    "tokens",
    "finops",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/Viprasol-Tech/agentcost"
Repository = "https://github.com/Viprasol-Tech/agentcost"
Issues = "https://github.com/Viprasol-Tech/agentcost/issues"
Website = "https://viprasol.com"

[project.scripts]
agentcost = "agentcost.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcost"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["B008", "B027", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
